name: PR Optional Checks

# Manually triggered on any branch/commit — run these against a PR when you
# want deeper confidence before merging.  Results are informational only;
# failures here do not block the PR.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-zig
      - name: Build
        run: zig build

  simulation:
    name: "Simulation (${{ matrix.workload.name }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        workload:
          - name: random_workload
            args: "--seeds 20 --ops 500"
          - name: order_workload
            args: "--order --seeds 20"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-zig
      - name: Run simulation
        run: zig build dst -- ${{ matrix.workload.args }}

  sqllogictest:
    name: SQLLogicTest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-zig
      - name: Install sqlite3
        run: sudo apt-get install -y libsqlite3-dev
      - name: Fetch upstream sqllogictest suite
        run: |
          git clone --depth=1 https://github.com/invisal/sqllogictest /tmp/slt-upstream
          cp -r /tmp/slt-upstream/test testing/sqllogictest/upstream
          rm -rf /tmp/slt-upstream
      - name: Run sqllogictest suite
        run: |
          echo '## SQLLogicTest Results' >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          zig build slt -- --dir testing/sqllogictest/upstream 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
