name: Setup Zig
description: Download and add Zig 0.16.0 to PATH

runs:
  using: composite
  steps:
    - name: Cache Zig 0.16.0
      id: cache-zig
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/zig/0.16.0
        key: zig-0.16.0-x86_64-linux

    - name: Install Zig 0.16.0
      if: steps.cache-zig.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ${{ runner.tool_cache }}/zig/0.16.0
        curl -fsSL "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz" -o zig.tar.xz
        tar xf zig.tar.xz --strip-components=1 -C ${{ runner.tool_cache }}/zig/0.16.0
        rm zig.tar.xz

    - name: Add Zig to PATH
      shell: bash
      run: echo "${{ runner.tool_cache }}/zig/0.16.0" >> $GITHUB_PATH
