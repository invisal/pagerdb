name: Setup Zig
description: Download and add Zig to PATH

inputs:
  version:
    description: Zig version to install
    required: true

runs:
  using: composite
  steps:
    - name: Cache Zig ${{ inputs.version }}
      id: cache-zig
      uses: actions/cache@v4
      with:
        path: zig-x86_64-linux-${{ inputs.version }}
        key: zig-${{ inputs.version }}-x86_64-linux

    - name: Install Zig ${{ inputs.version }}
      if: steps.cache-zig.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL "https://ziglang.org/download/${{ inputs.version }}/zig-x86_64-linux-${{ inputs.version }}.tar.xz" -o zig.tar.xz
        tar xf zig.tar.xz
        rm zig.tar.xz

    - name: Add Zig to PATH
      shell: bash
      run: echo "$PWD/zig-x86_64-linux-${{ inputs.version }}" >> $GITHUB_PATH
