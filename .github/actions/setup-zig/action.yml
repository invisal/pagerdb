name: Setup Zig
description: Download and add Zig to PATH

inputs:
  version:
    description: Zig version to install
    required: true

runs:
  using: composite
  steps:
    - name: Cache Zig ${{ inputs.version }}
      id: cache-zig
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/zig/${{ inputs.version }}
        key: zig-${{ inputs.version }}-x86_64-linux

    - name: Install Zig ${{ inputs.version }}
      if: steps.cache-zig.outputs.cache-hit != 'true'
      shell: bash
      run: |
        url=$(curl -fsSL https://ziglang.org/download/index.json | jq -r '.["${{ inputs.version }}"]["x86_64-linux"].tarball')
        mkdir -p ${{ runner.tool_cache }}/zig/${{ inputs.version }}
        curl -fsSL "$url" -o zig.tar.xz
        tar xf zig.tar.xz --strip-components=1 -C ${{ runner.tool_cache }}/zig/${{ inputs.version }}
        rm zig.tar.xz

    - name: Add Zig to PATH
      shell: bash
      run: echo "${{ runner.tool_cache }}/zig/${{ inputs.version }}" >> $GITHUB_PATH
